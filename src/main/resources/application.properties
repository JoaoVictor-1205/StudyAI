spring.application.name=StudyAI
server.address=127.0.0.1
server.servlet.session.tracking-modes=cookie

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/studyai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.ai.model.chat=openai
spring.ai.model.decision=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.timeout=45s
spring.ai.openai.max-retries=0
