spring.application.name=StudyAI
server.address=127.0.0.1
server.servlet.session.tracking-modes=cookie
# Endereços aceitos no cabeçalho Host. Outros nomes são recusados para impedir DNS rebinding.
studyai.hosts-permitidos=localhost,127.0.0.1
# O nome dos arquivos JS e CSS inclui um hash do conteúdo, para o navegador não usar uma versão antiga em cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/js/**,/css/**

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/studyai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# A chave do Gemini fica salva somente no navegador e chega ao servidor no cabeçalho X-Chave-Gemini de cada geração.
# Por isso o modelo de chat não é configurado automaticamente: GeminiChatClientFactory cria o cliente a cada geração.
spring.ai.model.chat=none
spring.ai.chat.client.enabled=false
spring.ai.model.decision=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

# Modelo estável com camada gratuita na API do Gemini. Use a variável GEMINI_MODEL para escolher outro.
studyai.gemini.modelo=${GEMINI_MODEL:gemini-3.6-flash}
studyai.gemini.tempo-limite=60s
